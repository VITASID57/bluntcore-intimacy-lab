name: BLUNTCORE Microtoys MCP smoke test
on:
  push:
    paths:
      - 'tools/bluntcore-mcp/**'
      - '.github/workflows/microtoys-mcp.yml'
  pull_request:
    paths:
      - 'tools/bluntcore-mcp/**'
      - '.github/workflows/microtoys-mcp.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix tools/bluntcore-mcp
